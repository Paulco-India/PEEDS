<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PEEDS — premium sports shoe manufacturer.">
    <title>PEEDS | Business Links</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <main class="page-shell">
      <section class="business-card" aria-labelledby="brand-name">
        <div class="card-overlay" aria-hidden="true"></div>

        <div class="card-content">
          <header class="brand-header">
            <!-- Replace logo.png with your final logo file if its name changes. -->
            <img class="brand-logo" src="BRAND-logo.svg" alt="BRAND logo">
            <p class="eyebrow">Welcome to</p>
            <h1 id="brand-name">PEEDS</h1>
            <p class="tagline">Premium Sports Shoe Manufacturer</p>
            <p class="brand-description">
              Sports footwear crafted for retailers, distributors and wholesale partners.
            </p>
          </header>

          <nav class="link-list" aria-label="PEEDS business links">
            <!-- Replace # with the final URL or filename for each destination. -->
            <a class="action-link" href="Brochure.pdf" target="_blank" rel="noopener">
              <i class="fa-regular fa-file-pdf" aria-hidden="true"></i><span>Download Brochure</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a>
            <a class="action-link" href="coming-soon.html">
              <i class="fa-solid fa-book-open" aria-hidden="true"></i><span>View Catalogue</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a>
            <!-- <a class="action-link" href="https://wa.me/919163292893?text=Hello%20PEEDS%2C%20I%20would%20like%20to%20know%20more." target="_blank" rel="noopener">
              <i class="fa-brands fa-whatsapp" aria-hidden="true"></i><span>Order via WhatsApp</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a> -->
            <a class="action-link" href="https://peeds.in" target="_blank" rel="noopener">
              <i class="fa-solid fa-globe" aria-hidden="true"></i><span>Visit Our Website</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a>
            <a class="action-link" href="https://facebook.com/peeds.paulco" target="_blank" rel="noopener">
              <i class="fa-brands fa-facebook-f" aria-hidden="true"></i><span>Follow on Facebook</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a>
            <a class="action-link" href="https://instagram.com/peeds.paulco" target="_blank" rel="noopener">
              <i class="fa-brands fa-instagram" aria-hidden="true"></i><span>Follow on Instagram</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a>
            <a class="action-link" href="https://maps.app.goo.gl/mtrFUuKEEHV5AWhG9" target="_blank" rel="noopener">
              <i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>Factory Location</span><i class="fa-solid fa-arrow-up-right-from-square arrow" aria-hidden="true"></i>
            </a>
          </nav>

          <footer class="card-footer">
            <img class="footer-logo" src="PEEDS-logo.svg" alt="PEEDS logo">
            <p class="values">Quality <span>•</span> Innovation <span>•</span> Trust</p>
            <p>Thank you for visiting.</p>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
